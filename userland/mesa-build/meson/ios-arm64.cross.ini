# Meson cross file: Mesa's OWN build graph targeting iOS arm64. ALTERNATIVE to the CMake route
# (CMakeLists.txt is the verified/primary one). NOT exercised on the Linux dev box: it needs an
# Apple toolchain + iPhoneOS SDK (macOS runner). See meson/configure-ios.sh.
#
# Mesa treats iOS as host_machine.system() == 'darwin' (meson.build:22,431,448,1911,2240); that is
# what the Meson `subsystem = 'ios'` cross files produce. Mesa's meson.build:2240 also does
# add_languages('objc') for darwin, so an objc compiler MUST be listed below.
#
# Substitute SDK and ARCH through the environment when invoking meson (see configure-ios.sh, which
# writes a resolved copy next to the build dir): @SDK@ @ARCH@ @MIN@.
[binaries]
c      = ['xcrun', '--sdk', 'iphoneos', 'clang']
cpp    = ['xcrun', '--sdk', 'iphoneos', 'clang++']
objc   = ['xcrun', '--sdk', 'iphoneos', 'clang']
ar     = ['xcrun', '--sdk', 'iphoneos', 'ar']
strip  = ['xcrun', '--sdk', 'iphoneos', 'strip']
pkg-config = 'false'          # nothing from pkg-config: libdrm/expat/zlib are all disabled
python = 'python3'            # host python with mako (generators run on the build machine)

[host_machine]
system     = 'darwin'
subsystem  = 'ios'
kernel     = 'xnu'
cpu_family = 'aarch64'
cpu        = '@ARCH@'          # arm64 | arm64e
endian     = 'little'

[built-in options]
c_args       = ['-arch', '@ARCH@', '-isysroot', '@SDK@', '-miphoneos-version-min=@MIN@'@PAC_ARGS@]
cpp_args     = ['-arch', '@ARCH@', '-isysroot', '@SDK@', '-miphoneos-version-min=@MIN@'@PAC_ARGS@]
objc_args    = ['-arch', '@ARCH@', '-isysroot', '@SDK@', '-miphoneos-version-min=@MIN@'@PAC_ARGS@]
c_link_args  = ['-arch', '@ARCH@', '-isysroot', '@SDK@', '-miphoneos-version-min=@MIN@'@PAC_ARGS@]
cpp_link_args = ['-arch', '@ARCH@', '-isysroot', '@SDK@', '-miphoneos-version-min=@MIN@'@PAC_ARGS@]
default_library = 'static'

[properties]
needs_exe_wrapper = true       # arm64 iOS binaries cannot run on the build machine
