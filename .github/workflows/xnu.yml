name: xnu

# Builds XNU (xnu-12377 / iOS 26 era) on a GitHub macOS runner via
# blacktop/darwin-xnu-build, applying xnu/patches/ in order.
#
# P1.0 baseline: MACHINE_CONFIG=VMAPPLE, no patches -> proves the DXB +
#   xnu-12377 + Xcode toolchain pipeline end to end.
# P1.1+: MACHINE_CONFIG=HUSKY once xnu/patches/0001-husky-machine-config
#   (a VMAPPLE-derived, arm64e, config_pmap_ppl board) lands.
#
# Unlike ios-sweet we build arm64e (husky has PAC; iOS 26 is arm64e-only),
# so there is no "add arm64 to VALID_ARCHS" step.

on:
  workflow_dispatch:
    inputs:
      macos_version:
        description: macOS release whose xnu to build (26.x = xnu-12377, iOS 26 era)
        default: "26.5"
      kernel_config:
        description: RELEASE / DEVELOPMENT / DEBUG
        default: DEVELOPMENT
      machine_config:
        description: xnu MACHINE_CONFIG (VMAPPLE baseline, HUSKY once patched in)
        default: VMAPPLE
      keep_going:
        description: make -k (collect all compile errors in one run)
        default: "true"
      use_ccache:
        description: route the compiler through ccache (off until the deployment-target interaction is resolved)
        default: "false"
      incremental:
        description: reuse the last green run's dxb tree (deps, KDK, xnu objects) via the Actions cache
        default: "true"
  # Dispatch-only: a push trigger raced every manual dispatch and left a
  # confusing concurrency-cancelled run each time. Build via `gh workflow run`.

concurrency:
  group: xnu-${{ github.ref }}
  cancel-in-progress: true

env:
  DXB_REPO: https://github.com/blacktop/darwin-xnu-build
  DXB_SHA: 663906528d1cd5ea8fde7de6f16de73db9511549
  MACOS_VERSION: ${{ inputs.macos_version || '26.5' }}
  KERNEL_CONFIG: ${{ inputs.kernel_config || 'DEVELOPMENT' }}
  MACHINE_CONFIG: ${{ inputs.machine_config || 'VMAPPLE' }}
  USE_CCACHE: ${{ inputs.use_ccache || 'false' }}
  INCREMENTAL: ${{ inputs.incremental || 'true' }}
  # One rolling entry per (version, config, board); bump v1 to force a cold build.
  DXB_CACHE_PREFIX: dxb-v1-${{ inputs.macos_version || '26.5' }}-${{ inputs.kernel_config || 'DEVELOPMENT' }}-${{ inputs.machine_config || 'VMAPPLE' }}-
  # ccache gives fast incremental rebuilds across runs (content-addressed, so
  # it survives DXB re-cloning xnu each run, unlike mtime-based object caches).
  CCACHE_DIR: ${{ github.workspace }}/.ccache
  # Capped well under GitHub's 10 GB/repo Actions-cache budget so the rolling
  # snapshots don't thrash; an xnu dev build's ccache is only ~1-2 GB.
  CCACHE_MAXSIZE: "4G"
  CCACHE_COMPILERCHECK: content
  CCACHE_SLOPPINESS: time_macros,include_file_mtime,include_file_ctime,file_macro,pch_defines,modules

jobs:
  build:
    # xnu-12377 (macOS 26) needs the Xcode 26 toolchain: its iig must match
    # this xnu's IORPC ABI, the same reason ios-sweet pinned macos-14 for
    # xnu-8796 / Xcode 15. Adjust if the macos-26 image label differs.
    runs-on: macos-26
    timeout-minutes: 150
    permissions:
      contents: read
      actions: write # prune superseded dxb cache entries
    steps:
      - uses: actions/checkout@v4

      - name: Fetch build script
        run: |
          git init -q dxb
          git -C dxb fetch -q --depth 1 "$DXB_REPO" "$DXB_SHA"
          git -C dxb checkout -q FETCH_HEAD
          # DXB applies 26.x patches from patches/$MACOS_VERSION, else patches/26.0
          # (alongside blacktop's own build-fix patches). Land ours in that dir.
          PD="dxb/patches/${MACOS_VERSION}"
          [ -d "$PD" ] || PD="dxb/patches/26.0"
          mkdir -p "$PD"
          shopt -s nullglob
          files=(xnu/patches/*.patch xnu/patches/*.sh)
          if [ ${#files[@]} -gt 0 ]; then cp "${files[@]}" "$PD"/; fi
          echo "patch dir $PD:"; ls "$PD" || true
          # Optionally route the compiler through ccache via SINGLE-executable
          # wrappers (make splits $(CC) into words, but xcodebuild execs CC as
          # one path). Off by default until the deployment-target interaction
          # with the Libsyscall mig step is sorted out.
          if [ "$USE_CCACHE" = "true" ]; then
            WRAP="$GITHUB_WORKSPACE/ccwrap"; mkdir -p "$WRAP"
            CLANG="$(xcrun -find clang)"; CLANGXX="$(xcrun -find clang++)"
            printf '#!/bin/sh\nexec ccache "%s" "$@"\n' "$CLANG"   > "$WRAP/clang"
            printf '#!/bin/sh\nexec ccache "%s" "$@"\n' "$CLANGXX" > "$WRAP/clang++"
            chmod +x "$WRAP/clang" "$WRAP/clang++"
            sed -i '' "s#export CC=\"\$(xcrun -find clang)\"#export CC=\"$WRAP/clang\"#" dxb/build.sh
            sed -i '' "s#export CXX=\"\$(xcrun -find clang++)\"#export CXX=\"$WRAP/clang++\"#" dxb/build.sh
            grep -n 'export C\(C\|XX\)=' dxb/build.sh | head
          else
            echo "ccache disabled for this run"
          fi
          # Apple ships no libHUSKY KernelSupport archive; HUSKY is VMAPPLE-class,
          # so alias the board's closed KDK support lib to VMAPPLE's before the
          # kernel link. Inject a one-liner at build_xnu[_library] start (KDKROOT
          # is set by then). Single-line sed — no heredoc (keeps the YAML valid).
          if [ "$MACHINE_CONFIG" = "HUSKY" ]; then
            INJ='for v in RELEASE DEVELOPMENT DEBUG; do KS="${KDKROOT}/System/Library/KernelSupport"; [ -f "$KS/libVMAPPLE.os.$v.a" ] \&\& sudo ln -sf "libVMAPPLE.os.$v.a" "$KS/libHUSKY.os.$v.a"; done'
            for fn in build_xnu_library build_xnu; do
              sed -i '' "s|^$fn() {|$fn() { $INJ|" dxb/build.sh
            done
            grep -n 'libHUSKY.os' dxb/build.sh | head
          fi

      # Incremental builds. DXB skips every dependency step whose output is
      # already in fakeroot/, and build_xnu runs make over the existing
      # xnu.obj, so restoring the last green run's tree leaves only the kernel
      # objects our patch changes touch. The Actions cache is private to the
      # repo and evicts by LRU at 10 GB; a release asset would be public.
      - name: Restore dxb tree
        id: dxbcache
        if: env.INCREMENTAL == 'true'
        uses: actions/cache/restore@v4
        with:
          path: |
            dxb/xnu
            dxb/build
            dxb/fakeroot
            dxb/venv
            kdkcache
          key: ${{ env.DXB_CACHE_PREFIX }}${{ github.run_id }}
          restore-keys: ${{ env.DXB_CACHE_PREFIX }}

      - name: Prepare incremental tree
        if: env.INCREMENTAL == 'true'
        run: |
          du -sh dxb/xnu dxb/build dxb/fakeroot kdkcache 2>/dev/null || true
          # The KDK pkg install takes ~1.5 min; a pruned copy rides in the cache.
          shopt -s nullglob
          for k in kdkcache/*.kdk; do
            sudo mkdir -p /Library/Developer/KDKs
            sudo ln -sfn "$PWD/$k" /Library/Developer/KDKs/
            echo "KDK from cache: $k"
          done
          if [ -d dxb/xnu/.git ]; then
            # Back to pristine so DXB re-applies the current patch series
            # (an edited patch would otherwise fail --check and be skipped).
            git -C dxb/xnu checkout -q -- .
            git -C dxb/xnu clean -fdqx -e compile_commands.json
            # Never let a stale kernel be collected, or satisfy build_xnu's
            # "already built" check.
            rm -f dxb/build/xnu.obj/kernel.* dxb/fakeroot/System/Library/Kernels/kernel.*
          fi
          # After patching, age unchanged sources so make only rebuilds real changes.
          sed -i '' 's|^    patches$|    patches; bash "'"$GITHUB_WORKSPACE"'/.github/scripts/xnu-mtime-sync.sh" "${WORK_DIR}/xnu" "${BUILD_DIR}/xnu-src.manifest"|' dxb/build.sh
          grep -n 'xnu-mtime-sync' dxb/build.sh

      - name: ccache cache
        if: ${{ (inputs.use_ccache || 'false') == 'true' }}
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.ccache
          key: ccache-${{ env.MACHINE_CONFIG }}-${{ github.run_id }}
          restore-keys: |
            ccache-${{ env.MACHINE_CONFIG }}-
            ccache-

      - name: Deps
        run: |
          brew install jq gum bash cmake ninja || true
          if [ "$USE_CCACHE" = "true" ]; then brew install ccache || true; ccache -z || true; fi
          # build.sh only checks that `xcodes` exists (Xcode is preinstalled).
          printf '#!/bin/sh\nexit 0\n' | sudo tee /usr/local/bin/xcodes >/dev/null
          sudo chmod +x /usr/local/bin/xcodes
          sw_vers
          ls -d /Applications/Xcode*.app || true
          XC=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
          echo "DEVELOPER_DIR=$XC/Contents/Developer" >> "$GITHUB_ENV"
          sudo xcode-select -s "$XC"
          xcodebuild -version
          xcrun --find iig

      - name: Build
        working-directory: dxb
        env:
          MAKEFLAGS: ${{ inputs.keep_going == 'false' && '' || '-k' }}
        run: |
          set -o pipefail
          # Tee to a file so a failure step can extract a tiny error report
          # on the runner (the full log is too big for a slow link to pull).
          bash build.sh 2>&1 | tee "$RUNNER_TEMP/build.log"

      # Only a green tree is saved: the source manifest is written before make
      # runs, so a failed build's state must never be restored.
      - name: Stage KDK for cache
        if: success() && env.INCREMENTAL == 'true'
        run: |
          shopt -s nullglob
          mkdir -p kdkcache
          for k in /Library/Developer/KDKs/*.kdk; do
            [ -L "$k" ] && continue # already the cached copy
            # The build only needs KernelSupport, usr/local, headers and
            # plists; the shipped kernels and dSYMs are most of the size.
            rsync -a --exclude 'System/Library/Kernels/' --exclude '*.dSYM' "$k" kdkcache/ \
              || { echo "KDK staging failed; next run downloads it again"; rm -rf "kdkcache/$(basename "$k")"; }
          done
          du -sh kdkcache/* dxb/xnu dxb/build dxb/fakeroot 2>/dev/null || true

      - name: Save dxb tree
        if: success() && env.INCREMENTAL == 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            dxb/xnu
            dxb/build
            dxb/fakeroot
            dxb/venv
            kdkcache
          key: ${{ env.DXB_CACHE_PREFIX }}${{ github.run_id }}

      - name: Prune superseded dxb caches
        if: success() && env.INCREMENTAL == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          KEEP="${DXB_CACHE_PREFIX}${GITHUB_RUN_ID}"
          gh cache list --key "$DXB_CACHE_PREFIX" --limit 50 --json key --jq '.[].key' \
            | while read -r k; do [ "$k" = "$KEEP" ] || gh cache delete "$k" || true; done
          gh cache list --limit 10 || true

      - name: Error summary
        if: failure()
        run: |
          LOG="$RUNNER_TEMP/build.log"; mkdir -p err
          # Deduped compile errors with ~3 lines of context each, Apple-path-stripped.
          grep -nE 'error:|fatal error:|No rule to make target|Undefined symbols|^[^ ]*ld: |#error' "$LOG" \
            | sed -E 's#/Users/[^ ]*/(xnu|dxb)/##g' | awk '!seen[$0]++' > err/errors.txt || true
          grep -nE -A3 'error:|fatal error:' "$LOG" \
            | sed -E 's#/Users/[^ ]*/(xnu|dxb)/##g' | head -400 > err/errors_ctx.txt || true
          tail -300 "$LOG" > err/tail.txt || true
          echo "=== errors.txt ($(wc -l < err/errors.txt) lines) ==="; head -60 err/errors.txt

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: xnu-errors
          path: err/
          retention-days: 7

      - name: ccache stats
        if: ${{ always() && (inputs.use_ccache || 'false') == 'true' }}
        run: ccache -s || true

      - name: Package build tree for local compiles
        if: always()
        run: |
          SDK=$(xcrun --sdk macosx --show-sdk-path)
          mkdir -p sdk-kernel-platform
          cp -R "$SDK/System/Library/Frameworks/Kernel.framework/Versions/A/PrivateHeaders/platform" sdk-kernel-platform/ || true
          tar czf buildtree.tgz \
            --exclude='*.o' --exclude='*.cpo' --exclude='*.a' --exclude='*.dSYM' --exclude='*.unstripped' \
            --exclude='kernel.*.*' --exclude='.git' \
            -C dxb build/xnu.obj fakeroot/usr/local/include xnu \
            -C .. sdk-kernel-platform || true
          ls -la buildtree.tgz || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: xnu-buildtree
          path: buildtree.tgz
          retention-days: 7

      - name: Collect
        if: always()
        run: |
          mkdir -p out
          cp -R dxb/fakeroot/System/Library/Kernels/. out/ 2>/dev/null || true
          ls -la out || true
          (cd out && shasum -a 256 kernel.* > SHA256SUMS) 2>/dev/null || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: xnu-kernel
          path: out/
          if-no-files-found: warn
